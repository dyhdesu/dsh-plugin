# Windows 宿主 shell 链运行时接管；不声明会话预设、不修改默认预设。
# 官方 tool-pwsh 与 pwsh-sandbox 不静态禁用：主行可服务后接管，失败回滚。
# guard 守服务，web 提供配置通道；POSIX 全部停用，官方 bash 链不受影响。

- insert:
    - id: shell-select
      name: '@mzzsfy/dsh-shell-select'
      disabled: !!js process.platform !== 'win32'
    - id: shell-select/guard
      name: '@mzzsfy/dsh-shell-select/guard'
      disabled: !!js process.platform !== 'win32'
    - id: shell-select/web
      name: '@mzzsfy/dsh-shell-select/web'
      disabled: !!js process.platform !== 'win32'
