# The auto-trust-all bundle patch: insert this plugin as one entry. Its host
# half wraps webServer routes and registers every arriving Host header into
# the connection service's trust array (webRuntime mirrored when present).
# The official webserver row is NOT overridden: 0.2.1-line hosts reject
# wildcard binds and own the bind policy, so the listener address belongs to
# the deployment (explicit --host or the stock default), not to this plugin.

- insert:
    - id: auto-trust-all
      name: '@mzzsfy/dsh-auto-trust-all'
